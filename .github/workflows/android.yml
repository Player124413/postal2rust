name: android-debug

# Builds the Android debug APK (arm64-v8a only) and checks that the desktop build still compiles
# after the host moved from the binary into the library.
#
# * Push to arena/** or ci/**, or run by hand: artifacts only.
# * The APK is signed with the fixed debug key in android/app/keystore, so each build updates the
#   previous one in place (same applicationId, same signature, a higher versionCode).
# * When a step fails, its error lines are repeated as annotations on the check run, so the
#   failure reason can be read without opening the raw logs.

on:
  push:
    branches: ["arena/**", "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  desktop-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check
      - name: Check the desktop game (library + binary)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cargo check -p p2game 2>&1 | tee ci-logs/cargo-check.log
      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.log; do
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$f" | grep -E "^error|^warning: unused|-->|panicked|What went wrong|Caused by" | head -60 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
          done

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is the number of commits: the full history is needed.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKMANAGER" 2>&1 | tee ci-logs/sdk.log || true
          (yes | "$SDKMANAGER" --licenses > /dev/null) 2>&1 | tee -a ci-logs/sdk.log || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tee -a ci-logs/sdk.log
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-release
      - name: "Build libp2android.so (release profile, so the game code is optimized in the debug APK)"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build -p p2android --profile release 2>&1 | tee ci-logs/cargo-ndk.log
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build the debug APK
        shell: bash
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../ci-logs
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../ci-logs/gradle.log
      - uses: actions/upload-artifact@v4
        with:
          name: Postal2Rust-android-arm64-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Report errors as annotations
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.log; do
            echo "== $f"
            sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$f" | grep -E "^error|^e: |^FAILURE|What went wrong|error:|-->|panicked|Caused by|Could not|not found|Failed" | head -60 | while IFS= read -r line; do
              echo "::error::${line//$'\r'/}"
            done
          done
